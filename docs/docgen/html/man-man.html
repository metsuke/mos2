<h1>MAN</h1>
<h2>NOMBRE</h2>
<p>man - muestra la pagina extendida de un comando</p>
<h2>SINOPSIS</h2>
<ul><li>man | man &lt;comando&gt;</li></ul>
<h2>DESCRIPCION</h2>
<p>Lee docs/man/&lt;comando&gt;.md. Si el comando es de app, puede usar el man que aporte la app. El HTML sale en docs/docgen/html/ al generar la tupla.</p>
<h2>VEASE TAMBIEN</h2>
<p>help, man</p>
