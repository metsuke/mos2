<p>write ruta\nhash\nbase64\n.\ndocgen generate &lt;id&gt;\n:e\n\nEn write.sh las lineas que no son write se ejecutan. Maximo tres writes. test 120. Ver IA_TOPE e IA_WRITE.</p>
